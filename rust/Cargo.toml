[package]
name = "memeforge"
version = "1.0.0"
edition = "2021"
description = "Make memes and GIFs on your PC"
license = "MIT"

[[bin]]
name = "memeforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
gif = "0.13"
color_quant = "1"
rayon = "1"
sha2 = "0.10"
rfd = "0.15"
open = "5"
urlencoding = "2"
winreg = "0.55"
clipboard-win = "5"
chrono = "0.4"
notify-rust = "4"
percent-encoding = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
